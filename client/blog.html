<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Damian Marquez</title>
    <meta name="description" content="Bienvenido al blog de Damian Marquez, Senior Full Stack Developer." />
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
      rel="stylesheet"
    />
    
    <!-- Link global portfolio styles so Vite processes it & we get noise, grid, and theme variables -->
    <link rel="stylesheet" href="./src/styles/global.css" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
      .blog-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        z-index: 2;
      }

      .blog-card {
        background: rgba(17, 17, 24, 0.7); /* glassmorphism card */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 4.5rem 3.5rem;
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
        opacity: 0;
        transform: translateY(30px);
        animation: cardFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .blog-card::before {
        content: '';
        position: absolute;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 200px;
        background: radial-gradient(ellipse, rgba(124, 109, 250, 0.15), transparent 70%);
        pointer-events: none;
      }

      .blog-tag {
        font-family: 'DM Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(124, 109, 250, 0.08);
        border: 1px solid rgba(124, 109, 250, 0.2);
        padding: 0.45rem 1.1rem;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 2rem;
        animation: glowPulse 2.5s infinite ease-in-out;
      }

      .blog-title {
        font-family: 'Syne', sans-serif;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text);
        margin-bottom: 1.5rem;
      }

      .blog-title span {
        color: var(--accent);
      }

      .blog-desc {
        font-family: 'DM Sans', sans-serif;
        font-size: 1.05rem;
        color: var(--muted);
        line-height: 1.8;
        margin-bottom: 3.5rem;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }

      .btn-back {
        font-family: 'DM Mono', monospace;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 1rem 2.2rem;
        border-radius: 4px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 15px rgba(124, 109, 250, 0.3);
      }

      .btn-back:hover {
        background: transparent;
        color: var(--accent);
        box-shadow: 0 4px 25px rgba(124, 109, 250, 0.1);
        transform: translateY(-2px);
      }

      .btn-back svg {
        transition: transform 0.3s ease;
      }

      .btn-back:hover svg {
        transform: translateX(-4px);
      }

      /* Background Orbs */
      .blog-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 1;
      }

      .blog-orb1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(124, 109, 250, 0.15), transparent 70%);
        top: -10%;
        left: -10%;
        animation: orbFloat 10s ease-in-out infinite;
      }

      .blog-orb2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(250, 109, 109, 0.1), transparent 70%);
        bottom: -5%;
        right: -5%;
        animation: orbFloat 14s ease-in-out infinite reverse;
      }

      /* Animations */
      @keyframes cardFadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glowPulse {
        0%, 100% {
          box-shadow: 0 0 5px rgba(124, 109, 250, 0.1);
          border-color: rgba(124, 109, 250, 0.15);
        }
        50% {
          box-shadow: 0 0 15px rgba(124, 109, 250, 0.25);
          border-color: rgba(124, 109, 250, 0.4);
        }
      }

      @keyframes orbFloat {
        0%, 100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(30px, -30px) scale(1.08);
        }
      }

      @media (max-width: 480px) {
        .blog-card {
          padding: 3.5rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background dynamic elements -->
    <div class="blog-orb blog-orb1"></div>
    <div class="blog-orb blog-orb2"></div>

    <div class="blog-container">
      <div class="blog-card">
        <span class="blog-tag">// blog personal</span>
        
        <h1 class="blog-title">
          Bienvenido al <span>Blog</span>
        </h1>
        
        <p class="blog-desc">
          Próximamente compartiré artículos técnicos sobre arquitectura de software, 
          sistemas distribuidos en Go/Java, integraciones de IA y automatización. 
          ¡Mantente al tanto!
        </p>
        
        <a href="/" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Volver al Inicio
        </a>
      </div>
    </div>
  </body>
</html>
